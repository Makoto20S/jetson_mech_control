# Software preview fixture, not measured anatomy, motor mapping or training dose.
exoskeleton_control:
  ros__parameters:
    policy: resistance
    output_mode: preview
    joint_names: [knee_joint]
    position_min: [-0.2]
    position_soft_margin_rad: 0.1  # rad; outward command cap falls near position bounds
    position_max: [2.4]
    max_velocity: [2.0]
    max_command: [0.3]
    max_slew: [0.5]
    run_limit_s: 10.0
    state_topic: knee/joint_state
    health_topic: knee/diagnostics
    calibration_status_names: [knee_kinematics]
    allow_motor_output: false
    joint_mapping_verified: false
