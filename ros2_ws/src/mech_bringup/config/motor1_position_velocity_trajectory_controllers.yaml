# Offline stock-Humble JTC example for the position+velocity hardware bundle.
# Loading this controller does not authorize activation against a real device.
controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    motor1_position_velocity_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

motor1_position_velocity_trajectory_controller:
  ros__parameters:
    joints:
      - motor1_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
    action_monitor_rate: 20.0
