# Application limits torque buildup; release must not be held by a second slow slew limiter.
controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dm4340_motor1_position_controller:
      type: mech_controllers/PositionCommandController
    dm4340_motor1_velocity_controller:
      type: mech_controllers/VelocityCommandController
    dm4340_motor1_effort_controller:
      type: mech_controllers/EffortCommandController
    dm4340_motor2_position_controller:
      type: mech_controllers/PositionCommandController
    dm4340_motor2_velocity_controller:
      type: mech_controllers/VelocityCommandController
    dm4340_motor2_effort_controller:
      type: mech_controllers/EffortCommandController
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
dm4340_motor1_velocity_controller:
  ros__parameters:
    joint: dm4340_motor1_joint
    minimum: -0.3
    maximum: 0.3
    max_slew_per_second: 1.0
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
dm4340_motor1_effort_controller:
  ros__parameters:
    joint: dm4340_motor1_joint
    minimum: -0.2
    maximum: 0.2
    max_slew_per_second: 100.0
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
dm4340_motor2_velocity_controller:
  ros__parameters:
    joint: dm4340_motor2_joint
    minimum: -0.3
    maximum: 0.3
    max_slew_per_second: 1.0
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
dm4340_motor2_effort_controller:
  ros__parameters:
    joint: dm4340_motor2_joint
    minimum: -0.2
    maximum: 0.2
    max_slew_per_second: 100.0
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
dm4340_motor1_position_controller:
  ros__parameters:
    joint: dm4340_motor1_joint
    minimum: -12.5
    maximum: 12.5
    max_slew_per_second: 0.2
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
dm4340_motor2_position_controller:
  ros__parameters:
    joint: dm4340_motor2_joint
    minimum: -12.5
    maximum: 12.5
    max_slew_per_second: 0.2
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
