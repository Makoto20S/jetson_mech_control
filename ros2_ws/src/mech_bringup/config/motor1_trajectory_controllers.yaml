# Standard-controller deployment: the upstream joint_trajectory_controller
# drives motor1 through the ADR-017 weak tier (it claims only
# motor1_joint/position, so the hardware treats every manager cycle as a
# refresh and sends one frame per cycle while the controller is active).
# The hardware position envelope in motor1.urdf.xacro (ADR-019) is the only
# bound on what this controller can command.
controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    motor1_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

motor1_trajectory_controller:
  ros__parameters:
    joints:
      - motor1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    # Start JTC's internal trajectory from measured state. CompositeSystem
    # also seeds new weak position claims to cover the switch-cycle write
    # before JTC's first update (ADR-017).
    set_last_command_interface_value_as_state_on_activation: false
    action_monitor_rate: 20.0
