# Single-motor AK3.0 force-control deployment example (Position sub-mode).
#
# WARNING: using this configuration against real hardware sends position
# commands to the motor. Real-device activation is gated by ADR-006
# (Proposed) and G0-G3 evidence, and every real-motor run needs the owner's
# explicit per-test authorization.

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz; the ADR-012 watchdog budget (<=6 ms) assumes this

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    motor1_position_controller:
      type: mech_controllers/PositionCommandController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

# PositionCommandController is the bounded, slew-limited position command
# controller from mech_controllers. Its
# target is clamped to [minimum, maximum] and slews at max_slew_per_second,
# with ADR-018's provisional upstream target lifetime. The independent
# controller-to-hardware lease remains 4/6 ms in the motor xacro.
#
# Targets arrive on the controller-relative topic ~/target_position
# (std_msgs/Float64), i.e. /motor1_position_controller/target_position. Each
# message refreshes the TTL even when it carries the same number; a bare
# control cycle never does. The watchdog runs on a steady clock rather than
# ROS time, so a frozen use_sim_time cannot keep a stale target alive.
motor1_position_controller:
  ros__parameters:
    joint: motor1_joint
    # Canonical radians, inside both the URDF limits and the AK3.0 device
    # range after motor1's +5.760604931781636 rad offset: [-6.2394, 11.7606].
    # Recheck these bounds if the mapping changes; they are not mechanical stops.
    minimum: -12.0
    maximum: 6.0
    max_slew_per_second: 2.0
    target_ttl_nanoseconds: 100000000
    target_hard_ttl_nanoseconds: 106000000
